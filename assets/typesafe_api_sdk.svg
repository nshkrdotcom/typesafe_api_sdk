<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="facet-top" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="facet-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.75"/>
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="hex-clip">
      <polygon points="100,12 176.21,56 176.21,144 100,188 23.79,144 23.79,56"/>
    </clipPath>
  </defs>

  <!-- Background enclosed in perfect hexagon -->
  <g clip-path="url(#hex-clip)">
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- Concentric geometric grid & guide rings -->
    <circle cx="100" cy="100" r="76" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#6366f1" stroke-opacity="0.1" stroke-width="1"/>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Intermediate regular hexagon guide track -->
    <polygon points="100,32 158.89,66 158.89,134 100,168 41.11,134 41.11,66" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- 6-Fold Optical Radial Bus Rails -->
    <line x1="100" y1="12" x2="100" y2="54" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="2 3"/>
    <line x1="176.21" y1="56" x2="139.84" y2="77" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="2 3"/>
    <line x1="176.21" y1="144" x2="139.84" y2="123" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="2 3"/>
    <line x1="100" y1="188" x2="100" y2="146" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="2 3"/>
    <line x1="23.79" y1="144" x2="60.16" y2="123" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="2 3"/>
    <line x1="23.79" y1="56" x2="60.16" y2="77" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="2 3"/>

    <!-- Primary Crystalline Prism Facets (Isometric 3D TypeSafe Core) -->
    <!-- Top Ingress Facet -->
    <polygon points="100,54 139.84,77 100,100 60.16,77" fill="url(#facet-top)" stroke="#7dd3fc" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Left Structured Facet -->
    <polygon points="100,100 60.16,77 60.16,123 100,146" fill="url(#facet-left)" stroke="#a5b4fc" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Right Scored Facet -->
    <polygon points="100,100 100,146 139.84,123 139.84,77" fill="url(#facet-right)" stroke="#5eead4" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Facet Interior Geometry & Accent Conduits -->
    <line x1="100" y1="54" x2="100" y2="100" stroke="#bae6fd" stroke-width="1.4" stroke-linecap="round" filter="url(#soft-glow)"/>
    <line x1="60.16" y1="123" x2="100" y2="100" stroke="#c7d2fe" stroke-width="1.4" stroke-linecap="round" filter="url(#soft-glow)"/>
    <line x1="139.84" y1="123" x2="100" y2="100" stroke="#99f6e4" stroke-width="1.4" stroke-linecap="round" filter="url(#soft-glow)"/>

    <!-- Concentric Inner Shield Hexagon -->
    <polygon points="100,80 117.32,90 117.32,110 100,120 82.68,110 82.68,90" fill="#040812" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.4" filter="url(#soft-glow)"/>

    <!-- Central Illuminated Core -->
    <circle cx="100" cy="100" r="14" fill="url(#core-glow)"/>
    <circle cx="100" cy="100" r="6" fill="#030712" stroke="#38bdf8" stroke-width="1.4"/>
    <circle cx="100" cy="100" r="2.5" fill="#ffffff" filter="url(#glow)"/>

    <!-- Data Transit Nodes on Secondary Hexagon Vertices -->
    <circle cx="100" cy="32" r="2.8" fill="#38bdf8" filter="url(#soft-glow)"/>
    <circle cx="158.89" cy="66" r="2.8" fill="#38bdf8" filter="url(#soft-glow)"/>
    <circle cx="158.89" cy="134" r="2.8" fill="#2dd4bf" filter="url(#soft-glow)"/>
    <circle cx="100" cy="168" r="2.8" fill="#2dd4bf" filter="url(#soft-glow)"/>
    <circle cx="41.11" cy="134" r="2.8" fill="#6366f1" filter="url(#soft-glow)"/>
    <circle cx="41.11" cy="66" r="2.8" fill="#6366f1" filter="url(#soft-glow)"/>
  </g>

  <!-- Outer Symmetrical Hexagonal Frame & Vertex Terminals -->
  <polygon points="100,12 176.21,56 176.21,144 100,188 23.79,144 23.79,56" fill="none" stroke="url(#rim)" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Outer Luminous Corner Beads -->
  <circle cx="100" cy="12" r="2.2" fill="#e0f2fe" filter="url(#soft-glow)"/>
  <circle cx="176.21" cy="56" r="2.2" fill="#e0f2fe" filter="url(#soft-glow)"/>
  <circle cx="176.21" cy="144" r="2.2" fill="#ccfbf1" filter="url(#soft-glow)"/>
  <circle cx="100" cy="188" r="2.2" fill="#ccfbf1" filter="url(#soft-glow)"/>
  <circle cx="23.79" cy="144" r="2.2" fill="#e0e7ff" filter="url(#soft-glow)"/>
  <circle cx="23.79" cy="56" r="2.2" fill="#e0e7ff" filter="url(#soft-glow)"/>
</svg>
